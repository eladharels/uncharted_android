name: Bug report
description: Report a problem with the Uncharted Android port
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Please do not attach or link game files. Only report problems with a dump of your own.

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - "Uncharted: Drake's Fortune"
        - "Uncharted 2: Among Thieves"
        - "Uncharted 3: Drake's Deception"
        - "The launcher (before a game starts)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone model and chip
      placeholder: For example, Galaxy S24 Ultra (Snapdragon 8 Gen 3)
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: For example, Android 16 / One UI 8.5

  - type: input
    id: driver
    attributes:
      label: GPU driver
      placeholder: For example, Mesa Turnip v27.0.0-20261020-r4-8G2-OneUI
    validations:
      required: true

  - type: input
    id: dump
    attributes:
      label: Dump title ID and version
      placeholder: For example, CUSA02344 v01.02

  - type: input
    id: app_version
    attributes:
      label: App version or commit

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick Uncharted 2 on the home screen.
        2. Launch.
        3. ...

  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: log_zip
    attributes:
      label: Log zip
      description: |
        In the app, open **About → Export logs**, then drag the `.zip` into this box.
        If the export fails, paste the text of `android-game.log` instead.
    validations:
      required: true
