name: android

on:
  pull_request:
  push:
    branches: [main, gow3, android-port]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GOW3_BUILD_TYPE: Release
  # These paths are intentionally outside the checkout and are never uploaded.

jobs:
  source-check:
    name: Android source checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Android manifests and packaging tests
        run: |
          python -m unittest \
            discover -s tests -p 'test_android_*.py'
          python -m py_compile tools/android/*.py

  release:
    name: Build signed Android release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    env:
      GOW3_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOW3_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GOW3_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOW3_FEXDROID_APK_URL: ${{ vars.GOW3_FEXDROID_APK_URL }}
      GOW3_FEXDROID_APK_SHA256: ${{ vars.GOW3_FEXDROID_APK_SHA256 }}

    steps:
      - name: Check out source
        id: s_check_out_source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        id: s_set_up_jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        id: s_set_up_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Android SDK package cache
        id: s_restore_android_sdk_package_cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_PLATFORM }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up native dependency environment
        id: s_set_up_native_dependency_environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Set up Android SDK
        id: s_set_up_android_sdk
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;29.0.14206865

      - name: Install Android and native build tools
        id: s_install_android_and_native_build_tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Restore reproducible build caches
        id: s_restore_reproducible_build_caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/src
            .local-deps/android/m2
            .local-deps/android/steam-libs
            ~/.cache/ccache
          key: android-${{ runner.os }}-${{ hashFiles('tools/android/**', 'cpu/**', 'gpu/CMakeLists.txt', 'gpu/third_party/**', 'ci/**') }}
          restore-keys: android-${{ runner.os }}-

      - name: Restore fexdroid APK cache
        id: s_restore_fexdroid_apk_cache
        uses: actions/cache@v4
        with:
          path: .local-deps/android/fexdroid-legacy.apk
          key: fexdroid-apk-${{ vars.GOW3_FEXDROID_APK_SHA256 || '21bed34092f698e39e77138589ebdab8d3498577ffc4fdc3bfef1c711b50d3bf' }}

      - name: Build pinned host dependencies
        id: s_build_pinned_host_dependencies
        shell: bash -el {0}
        run: |
          set -o pipefail
          bash ci/setup-deps.sh "$CONDA_PREFIX" 2>&1 | tee "$RUNNER_TEMP/ci-log-1-host-deps.log"

      - name: Configure temporary paths
        id: s_configure_temporary_paths
        shell: bash
        run: |
          {
            echo "GOW3_KEYSTORE=$RUNNER_TEMP/gow3-release.keystore"
            echo "GOW3_BRIDGE_APK=$GITHUB_WORKSPACE/.local-deps/android/fexdroid-legacy.apk"
          } >> "$GITHUB_ENV"

      - name: Restore signing keystore
        id: s_restore_signing_keystore
        shell: bash
        run: |
          set +x
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_BASE64; do
            if [[ -z ${!name:-} ]]; then
              echo "::error title=Signing::Missing required GitHub secret: $name"
              exit 1
            fi
            printf '::add-mask::%s\n' "${!name}"
          done
          bash tools/android/inputs/prepare_signing.sh "$GOW3_KEYSTORE"

      - name: Fetch Steam libraries
        id: s_fetch_steam_libraries
        shell: bash
        run: |
          set -euo pipefail
          bash tools/android/inputs/fetch_steam_libs.sh 2>&1 | tee "$RUNNER_TEMP/ci-log-2-steam-libs.log"

      # Vulkan 驱动不进 payload：设备侧由 DriverManager / install_bionic_driver.sh 安装
      # adrenotools 风格驱动包（下载源见 launcher assets driver_sources.json）。

      - name: Build the Bionic runtime
        id: s_build_the_bionic_runtime
        shell: bash -el {0}
        run: |
          set -o pipefail
          bash tools/android/build_bionic_deps.sh 2>&1 | tee "$RUNNER_TEMP/ci-log-3-bionic-deps.log"
          bash tools/android/build_bionic.sh 2>&1 | tee "$RUNNER_TEMP/ci-log-4-bionic-runtime.log"

      - name: Build and sign the release APK
        id: s_build_and_sign_the_release_apk
        run: |
          set -o pipefail
          bash tools/android/apk/build_release_apk.sh 2>&1 | tee "$RUNNER_TEMP/ci-log-5-apk.log"
          # uncharted_android: the packaging names the APK after the app ("God of War III-...apk",
          # with spaces); give it a plain name before the checksum and the upload.
          built=$(ls -1 out/release/*.apk 2>/dev/null | head -n 1)
          test -n "$built" || { echo 'No APK was produced' >&2; exit 1; }
          apk=out/release/uncharted-android-${GITHUB_SHA::8}.apk
          [ "$built" = "$apk" ] || mv -f "$built" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_ENV"

      - name: Publish build summary
        id: s_publish_build_summary
        run: |
          {
            echo '## Android build/package verified'
            echo
            printf '%s\n' "- Commit: ${GITHUB_SHA}"
            printf '%s\n' "- APK: $(basename "$APK")"
            printf '%s\n' "- SHA-256: ${APK_SHA256}"
            echo '- ABI: `arm64-v8a`'
            echo '- Scope: build, package, signature, and checksum verification only'
            echo '- Not verified by CI: device installation, Vulkan, Turnip/GPU compatibility, and gameplay'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and checksum
        id: s_upload_signed_apk_and_checksum
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-android-arm64-${{ github.sha }}
          path: |
            out/release/*.apk
            out/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      # uncharted_android: the unstripped libraries of this build, for symbolizing the app's
      # sampling profiler output (GOW3_PROFILE, tools/android/profile/symbolize.py).
      - name: Upload symbols
        id: s_upload_symbols
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-android-symbols-${{ github.sha }}
          path: |
            out/bionic/gpu/libgow3gpu.so
            out/bionic/fex/libgow3cpu.so
            out/bionic/bin/gow3-probe
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      # uncharted_android: the failing build's error lines as check annotations, readable through
      # the checks API (the last log written is the step that failed).
      - name: Report build errors
        id: s_report_build_errors
        if: failure()
        shell: bash {0}
        env:
          STEP_OUTCOMES: |
            checkout=${{ steps.s_check_out_source.outcome }}
            jdk=${{ steps.s_set_up_jdk.outcome }}
            python=${{ steps.s_set_up_python.outcome }}
            micromamba=${{ steps.s_set_up_native_dependency_environment.outcome }}
            android_sdk=${{ steps.s_set_up_android_sdk.outcome }}
            apt=${{ steps.s_install_android_and_native_build_tools.outcome }}
            host_deps=${{ steps.s_build_pinned_host_dependencies.outcome }}
            signing=${{ steps.s_restore_signing_keystore.outcome }}
            steam_libs=${{ steps.s_fetch_steam_libraries.outcome }}
            bionic=${{ steps.s_build_the_bionic_runtime.outcome }}
            apk=${{ steps.s_build_and_sign_the_release_apk.outcome }}
        run: |
          annotate() { # title, text: one annotation, newlines encoded
            printf '::error title=%s::%s\n' "$1" "$(printf '%s' "$2" | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          }
          annotate "step outcomes" "$STEP_OUTCOMES"
          logs=$(ls -1 "$RUNNER_TEMP"/ci-log-*.log 2>/dev/null | sort)
          if [ -z "$logs" ]; then
            annotate "Build failed" "before any logged build step (checkout, setup, deps or signing)"
            exit 0
          fi
          log=$(printf '%s\n' "$logs" | tail -n 1)
          name=$(basename "$log" .log)
          annotate "steps logged" "$logs"
          errors=$(grep -n -iE 'error|fatal|undefined reference|failed|STOP:|No such file|not found' "$log" | grep -v -iE 'werror|-Wno-error|error_count|errors\.h' | head -n 105)
          for part in 1 2 3 4 5 6 7; do
            chunk=$(printf '%s\n' "$errors" | sed -n "$(( (part - 1) * 15 + 1 )),$(( part * 15 ))p")
            [ -n "$chunk" ] && annotate "$name errors $part" "$chunk"
          done
          annotate "$name tail" "$(tail -n 30 "$log")"
          exit 0

      - name: Remove signing material
        id: s_remove_signing_material
        if: always()
        shell: bash
        run: |
          set +x
          rm -f -- "$GOW3_KEYSTORE"

  publish-release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK and checksum
        id: s_download_signed_apk_and_checksum
        uses: actions/download-artifact@v4
        with:
          name: uncharted-android-arm64-${{ github.sha }}

      - name: Publish the release
        id: s_publish_the_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.apk.sha256
          generate_release_notes: true
